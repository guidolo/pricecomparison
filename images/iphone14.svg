<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="300" height="600" viewBox="0 0 300 600" xmlns="http://www.w3.org/2000/svg">
  <!-- iPhone body -->
  <rect x="50" y="20" width="200" height="560" rx="40" ry="40" fill="#b0c4de" stroke="#888" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="60" y="40" width="180" height="520" rx="20" ry="20" fill="#4169e1"/>
  
  <!-- Gradient background for screen -->
  <defs>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#0000ff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  <rect x="65" y="45" width="170" height="510" rx="15" ry="15" fill="url(#screenGradient)"/>
  
  <!-- Notch -->
  <rect x="110" y="45" width="80" height="25" rx="10" ry="10" fill="#000"/>
  
  <!-- Camera system -->
  <circle cx="80" cy="80" r="15" fill="#000" stroke="#555" stroke-width="2"/>
  <circle cx="80" cy="80" r="7" fill="#333"/>
  <circle cx="80" cy="80" r="3" fill="#666"/>
  
  <circle cx="80" cy="120" r="15" fill="#000" stroke="#555" stroke-width="2"/>
  <circle cx="80" cy="120" r="7" fill="#333"/>
  <circle cx="80" cy="120" r="3" fill="#666"/>
  
  <!-- Apple logo -->
  <circle cx="150" cy="300" r="20" fill="white"/>
  <path d="M150,285 C155,285 165,290 165,300 C165,315 150,325 150,325 C150,325 135,315 135,300 C135,290 145,285 150,285 Z" fill="#b0c4de"/>
  <path d="M160,290 L155,280" stroke="#b0c4de" stroke-width="2"/>
</svg>
