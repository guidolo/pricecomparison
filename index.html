<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0069f1">
    <meta name="description" content="Compara precios y ofertas de smartphones con Kueski Pay.">
    <title>Comparador de precios</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="product-details-styles.css">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="app-container">
        <!-- Barra de estado -->
        <div class="status-bar">
            <span class="time">9:58</span>
            <div class="status-icons" aria-hidden="true">
                <span class="signal"><i class="fas fa-signal"></i></span>
                <span class="wifi"><i class="fas fa-wifi"></i></span>
                <span class="battery"><i class="fas fa-battery-three-quarters"></i></span>
            </div>
        </div>

        <!-- Contenedor principal del producto -->
        <main class="product-view">
            <!-- Navegación superior -->
            <div class="top-nav">
                <div class="left-buttons">
                    <button type="button" class="close-btn" aria-label="Volver al buscador">
                        <i class="fas fa-times" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="right-buttons">
                    <button type="button" class="share-btn" aria-label="Compartir producto">
                        <i class="fas fa-share-alt" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="wishlist-btn" aria-label="Guardar en favoritos" aria-pressed="false">
                        <i class="far fa-heart" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="price-alert-btn" aria-label="Crear alerta de precio" aria-pressed="false">
                        <i class="far fa-bell" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <!-- Carrusel de imágenes -->
            <div class="product-carousel">
                <div class="product-image">
                    <img src="images/iphone14.svg" alt="Imagen del producto" id="product-img">
                </div>
                <div class="carousel-dots" role="tablist" aria-label="Imágenes del producto"></div>
            </div>

            <!-- Información del producto -->
            <div class="product-info">
                <p class="category"></p>
                <h1 class="product-title">Cargando producto…</h1>
                <div class="rating">
                    <span class="rating-source">Calificación</span>
                    <span class="rating-value">—</span>
                    <div class="stars" aria-hidden="true"></div>
                    <span class="reviews-count"></span>
                </div>

                <!-- Selectores (color, almacenamiento, condición) -->
                <div class="product-options"></div>

                <!-- Precio -->
                <div class="price-container">
                    <span class="price-label">Desde</span>
                    <span class="price-value">—</span>
                </div>

                <!-- Pestañas -->
                <div class="tab-navigation" role="tablist" aria-label="Secciones del producto">
                    <button type="button" class="tab active" role="tab" aria-selected="true" aria-controls="panel-offers">
                        <i class="fas fa-tag" aria-hidden="true"></i>
                        <span>Ofertas</span>
                    </button>
                    <button type="button" class="tab" role="tab" aria-selected="false" aria-controls="panel-chart">
                        <i class="fas fa-chart-line" aria-hidden="true"></i>
                        <span>Precios</span>
                    </button>
                    <button type="button" class="tab" role="tab" aria-selected="false" aria-controls="panel-details">
                        <i class="fas fa-info-circle" aria-hidden="true"></i>
                        <span>Ficha técnica</span>
                    </button>
                </div>
            </div>

            <!-- Ofertas -->
            <section class="offers-section" id="panel-offers" role="tabpanel">
                <div class="offers-header">
                    <h2>Ofertas</h2>
                    <a href="#" class="view-all">Ver todo</a>
                </div>
                <p class="offers-subtext">
                    <i class="fas fa-info-circle" aria-hidden="true"></i>
                    Ordenadas de menor a mayor precio
                </p>
                <div class="offers-list"></div>
            </section>

            <!-- Gráfico de precios -->
            <section class="price-chart-section" id="panel-chart" role="tabpanel" hidden>
                <div class="price-chart-header">
                    <h2>Historial de precios</h2>
                    <p class="price-chart-subtext">Últimos 6 meses de la oferta seleccionada</p>
                </div>
                <div class="price-chart-card">
                    <canvas id="priceChartCanvas" height="240" role="img"
                            aria-label="Gráfico del historial de precios"></canvas>
                </div>
                <div class="price-chart-legend" id="price-chart-legend"></div>
            </section>

            <!-- Ficha técnica -->
            <section class="product-details-section" id="panel-details" role="tabpanel" hidden>
                <div class="product-details-header">
                    <h2>Ficha técnica</h2>
                </div>
                <div class="product-details-content"></div>
            </section>
        </main>

        <!-- Navegación inferior -->
        <nav class="bottom-nav" aria-label="Navegación principal">
            <button type="button" class="nav-item active">
                <i class="fas fa-home" aria-hidden="true"></i>
                <span>Inicio</span>
            </button>
            <button type="button" class="nav-item">
                <i class="far fa-heart" aria-hidden="true"></i>
                <span>Favoritos</span>
            </button>
            <button type="button" class="nav-item">
                <i class="fas fa-th-list" aria-hidden="true"></i>
                <span>Productos</span>
            </button>
            <button type="button" class="nav-item">
                <i class="far fa-bell" aria-hidden="true"></i>
                <span>Alertas</span>
            </button>
            <button type="button" class="nav-item">
                <i class="far fa-user" aria-hidden="true"></i>
                <span>KueskiPay</span>
            </button>
        </nav>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <!-- Scripts -->
    <script src="utils.js"></script>
    <script src="product-loader.js"></script>
    <script src="offers-loader.js"></script>
    <script src="product-details.js"></script>
    <script src="script.js"></script>
</body>
</html>
