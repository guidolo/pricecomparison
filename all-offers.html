<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0069f1">
    <meta name="description" content="Todas las ofertas disponibles para el producto seleccionado.">
    <title>Todas las ofertas</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="all-offers-styles.css">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="app-container">
        <!-- Barra de estado -->
        <div class="status-bar">
            <span class="time">9:58</span>
            <div class="status-icons" aria-hidden="true">
                <span class="signal"><i class="fas fa-signal"></i></span>
                <span class="wifi"><i class="fas fa-wifi"></i></span>
                <span class="battery"><i class="fas fa-battery-three-quarters"></i></span>
            </div>
        </div>

        <main class="all-offers-view">
            <div class="top-nav">
                <button type="button" class="back-btn" id="back-to-product" aria-label="Volver al producto">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i>
                </button>
                <h1 class="page-title">Todas las ofertas</h1>
                <button type="button" class="share-btn" aria-label="Compartir">
                    <i class="fas fa-share-alt" aria-hidden="true"></i>
                </button>
            </div>

            <div class="product-summary">
                <div class="product-image-small">
                    <img src="images/iphone14.svg" alt="Imagen del producto" id="product-img-small">
                </div>
                <div class="product-info-summary">
                    <h2 class="product-title-small" id="product-title-small">Cargando…</h2>
                    <p class="variant-info" id="variant-info"></p>
                </div>
            </div>

            <section class="offers-section">
                <div class="offers-header">
                    <h2 id="offers-count">Cargando ofertas…</h2>
                </div>
                <p class="offers-subtext">
                    <i class="fas fa-info-circle" aria-hidden="true"></i>
                    Ordenadas de menor a mayor precio
                </p>
                <div class="offers-list" id="all-offers-list" aria-live="polite"></div>
            </section>
        </main>

        <nav class="bottom-nav" aria-label="Navegación principal">
            <button type="button" class="nav-item active">
                <i class="fas fa-home" aria-hidden="true"></i>
                <span>Inicio</span>
            </button>
            <button type="button" class="nav-item">
                <i class="far fa-heart" aria-hidden="true"></i>
                <span>Favoritos</span>
            </button>
            <button type="button" class="nav-item">
                <i class="fas fa-th-list" aria-hidden="true"></i>
                <span>Productos</span>
            </button>
            <button type="button" class="nav-item">
                <i class="far fa-bell" aria-hidden="true"></i>
                <span>Alertas</span>
            </button>
            <button type="button" class="nav-item">
                <i class="far fa-user" aria-hidden="true"></i>
                <span>KueskiPay</span>
            </button>
        </nav>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="utils.js"></script>
    <script src="all-offers-loader.js"></script>
</body>
</html>
